name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches-ignore:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc)
        run: bun run lint

      - name: Production build check
        run: bun run build

      - name: Verify GitHub Pages bundle
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q 'src="./assets/' dist/index.html
          ! grep -qE '(src|href)="/src/' dist/index.html
